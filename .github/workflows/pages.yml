name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique : outils/nouveautes.py y lit les dates des livres

      - name: Dessiner les illustrations
        run: python3 outils/illustrer/generer.py > /dev/null

      - name: Vérifier que les illustrations ont les empreintes validées
        run: |
          if [ -n "$(git status --porcelain -- outils/illustrer/empreintes.txt livres)" ]; then
            echo "Des images diffèrent de outils/illustrer/empreintes.txt : relancer generer.py et valider le résultat."
            git status --short -- outils/illustrer/empreintes.txt livres
            git diff -- outils/illustrer/empreintes.txt | head -50
            exit 1
          fi

      - name: Vérifier les livres et les images
        run: python3 outils/verifier-images.py

      - name: Tester l'ordre des pages du livret
        run: node --test

      - name: Mettre à jour les nouveautés
        run: python3 outils/nouveautes.py

      - name: Préparer le site (sans les outils de dessin)
        run: |
          rsync -a ./ _site/ \
            --exclude .git --exclude .github --exclude .claude --exclude _site \
            --exclude AGENTS.md \
            --exclude __pycache__ --exclude outils/illustrer --exclude 'outils/*.py' --exclude 'outils/*.test.js'

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v5
