name: Vérifier et publier le site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: ./.github/workflows/site-ci.yml
    with:
      output: _site
      node-version-file: .nvmrc
      fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
      check: bash .github/verifier-site.sh
      build: bash .github/preparer-site.sh
