<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livres pour enfants</title>
  <meta name="description" content="Des livres illustrés pour enfants à lire à l'écran ou à imprimer.">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ff7a59">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Livres">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="entete">
    <a class="entete__logo" href="index.html"><span aria-hidden="true">📚</span> Livres pour enfants</a>
    <div class="entete__actions">
      <button class="bouton bouton--secondaire" id="installer" type="button" hidden>📲 Installer l'application</button>
    </div>
  </header>

  <main class="contenu">
    <section class="intro">
      <h1>Ma bibliothèque</h1>
      <p>Choisis un livre pour le lire à l'écran, ou imprime-le sur des feuilles pour en faire un vrai petit livre.</p>
      <p>Dans presque tous les livres, une petite coccinelle se cache à chaque page : sauras-tu la trouver ?</p>
    </section>

    <form id="recherche" class="recherche" role="search" hidden>
      <label class="recherche__mots">
        <span class="visuellement-cache">Chercher un livre</span>
        <input type="search" id="mots" placeholder="🔎 Chercher : loup, lune, Noël…" autocomplete="off" enterkeyhint="search">
      </label>
      <label class="recherche__choix">
        <span>Âge</span>
        <select id="age">
          <option value="">tous les âges</option>
          <option value="2">2 ans</option>
          <option value="3">3 ans</option>
          <option value="4">4 ans</option>
          <option value="5">5 ans</option>
          <option value="6">6 ans</option>
          <option value="7">7 ans</option>
          <option value="8">8 ans</option>
        </select>
      </label>
      <label class="recherche__choix">
        <span>Lecture</span>
        <select id="lecture">
          <option value="">tous les livres</option>
          <option value="non">pas encore lus</option>
          <option value="oui">déjà lus</option>
        </select>
      </label>
    </form>

    <nav id="rayons" class="filtres" aria-label="Rayons de la bibliothèque" hidden></nav>

    <p id="resultat" class="recherche__resultat" role="status" hidden></p>

    <div id="etageres" class="etageres">
      <p class="message">Chargement des livres…</p>
    </div>
  </main>

  <script src="livres/catalogue.js"></script>
  <script src="livres/nouveautes.js"></script>
  <script src="js/livres.js"></script>
  <script src="js/bibliotheque.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
